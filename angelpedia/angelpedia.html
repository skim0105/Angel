  <style>
    /* =============================
       ANGELPEDIA INTRO LOADING PAGE
    ============================== */

    body.is-loading {
      overflow: hidden;
    }

    .angelpedia-loader {
      position: fixed;
      inset: 0;
      z-index: 99999;

      width: 100%;
      height: 100vh;
      height: 100dvh;

      background-color: #ffffff;
      color: #000000;

      opacity: 1;
      visibility: visible;

      transition:
        opacity 0.8s ease,
        visibility 0.8s ease;
    }

    .angelpedia-loader.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .angelpedia-loader-inner {
      position: relative;

      width: 100%;
      height: 100%;
    }

    /* 상단 한글 + 영문 안내 문구 */

    .angelpedia-loader-guide {
      position: absolute;

      top: 34px;
      left: 34px;
      right: 34px;
    }

    .angelpedia-loader-korean,
    .angelpedia-loader-english {
      margin: 0;

      overflow: hidden;
      white-space: nowrap;

      font-family:
        "Pretendard",
        "Apple SD Gothic Neo",
        Arial,
        sans-serif;

      font-weight: 400;
    }

    .angelpedia-loader-korean {
      min-height: 1.2em;

      font-size: clamp(34px, 1.15vw, 18px);
      line-height: 1.2;
      letter-spacing: -0.035em;
    }

    .angelpedia-loader-english {
      min-height: 1.2em;

      margin-top: 6px;

      font-size: clamp(34px, 1vw, 16px);
      line-height: 1.2;
      letter-spacing: -0.02em;
    }

    /* 왼쪽 아래 COMMAND + P */

    .angelpedia-loader-command {
      position: absolute;

      left: 34px;
      bottom: 34px;

      min-height: 1em;

      margin: 0;

      font-family:
        "Helvetica Neue",
        Helvetica,
        Arial,
        sans-serif;

      font-size: clamp(230px, 5vw, 80px);
      font-weight: 300;
      line-height: 1;
      letter-spacing: -0.05em;

      white-space: nowrap;
    }

    /* 타이핑 커서 */

    .angelpedia-loader .is-typing::after {
      content: "";

      display: inline-block;

      width: 0.07em;
      height: 0.9em;

      margin-left: 0.1em;

      background-color: currentColor;
      vertical-align: -0.05em;

      animation: angelpedia-cursor 0.7s step-end infinite;
    }

    @keyframes angelpedia-cursor {
      0%,
      50% {
        opacity: 1;
      }

      51%,
      100% {
        opacity: 0;
      }
    }

    @media (max-width: 700px) {
      .angelpedia-loader-guide {
        top: 20px;
        left: 20px;
        right: 20px;
      }

      .angelpedia-loader-command {
        left: 20px;
        bottom: 20px;
      }
    }

    /* 프린트할 때 로딩 화면 제외 */

    @media print {
      .angelpedia-loader {
        display: none !important;
      }
    }
  </style>

  <script>
  /* =============================
     TYPING INTRO
  ============================== */

  const angelpediaLoader =
    document.getElementById("angelpediaLoader");

  const angelpediaLoaderKorean =
    document.getElementById("angelpediaLoaderKorean");

  const angelpediaLoaderEnglish =
    document.getElementById("angelpediaLoaderEnglish");

  const angelpediaLoaderCommand =
    document.getElementById("angelpediaLoaderCommand");


  const loaderKoreanText =
    "ANGELPEDIA에 기록된 시대별 날개 도상들의 상세 정보를 프린트하여 확인해보세요";

  const loaderEnglishText =
    "Print and review detailed information on the wing iconography of each era archived in ANGELPEDIA";

  const loaderCommandText =
    "COMMAND + P";


  function wait(milliseconds) {
    return new Promise((resolve) => {
      window.setTimeout(resolve, milliseconds);
    });
  }


  /* 문장을 화면 가로폭에 맞게 자동으로 확대 */

  function fitSingleLineText(
    element,
    text,
    minimumSize,
    maximumSize
  ) {
    element.textContent = text;

    let minimum = minimumSize;
    let maximum = maximumSize;

    for (let i = 0; i < 20; i += 1) {
      const middle = (minimum + maximum) / 2;

      element.style.fontSize = `${middle}px`;

      if (element.scrollWidth <= element.clientWidth) {
        minimum = middle;
      } else {
        maximum = middle;
      }
    }

    element.style.fontSize = `${minimum}px`;
    element.textContent = "";
  }


  /* 타이핑 애니메이션 */

  function typeLoaderText(element, text, speed) {
    return new Promise((resolve) => {
      let index = 0;

      element.textContent = "";
      element.classList.add("is-typing");

      function typeNextCharacter() {
        if (index < text.length) {
          element.textContent += text[index];
          index += 1;

          window.setTimeout(
            typeNextCharacter,
            speed
          );

          return;
        }

        element.classList.remove("is-typing");
        resolve();
      }

      typeNextCharacter();
    });
  }


  async function playAngelPediaIntro() {
    /* 웹폰트가 로드된 후 글자 크기 계산 */

    if (document.fonts && document.fonts.ready) {
      await document.fonts.ready;
    }

    fitSingleLineText(
      angelpediaLoaderKorean,
      loaderKoreanText,
      20,
      90
    );

    fitSingleLineText(
      angelpediaLoaderEnglish,
      loaderEnglishText,
      18,
      80
    );


    /* 로딩 화면이 열린 뒤 잠시 대기 */

    await wait(600);


    /* 한국어 타이핑: 숫자가 클수록 느림 */

    await typeLoaderText(
      angelpediaLoaderKorean,
      loaderKoreanText,
      55
    );


    /* 한국어와 영어 사이 대기 */

    await wait(500);


    /* 영어 타이핑 */

    await typeLoaderText(
      angelpediaLoaderEnglish,
      loaderEnglishText,
      40
    );


    /* 영어와 COMMAND + P 사이 대기 */

    await wait(700);


    /* COMMAND + P 타이핑 */

    await typeLoaderText(
      angelpediaLoaderCommand,
      loaderCommandText,
      130
    );


    /* 모든 문장이 나온 상태로 유지 */

    await wait(2000);


    /* 로딩 화면 페이드아웃 */

    angelpediaLoader.classList.add("is-hidden");
    document.body.classList.remove("is-loading");


    /* 페이드아웃 완료 후 로딩 요소 삭제 */

    window.setTimeout(() => {
      angelpediaLoader.remove();
    }, 850);
  }


  playAngelPediaIntro();


  /* =============================
     ERA FILTER
  ============================== */

  const eraButtons =
    document.querySelectorAll(".era-list li");

  const pediaSets =
    document.querySelectorAll(".pedia-set");

  const printPages =
    document.querySelectorAll(".print-page");


  eraButtons.forEach((button) => {
    button.addEventListener("click", () => {
      const selectedEra = button.dataset.era;

      document.body.setAttribute(
        "data-era",
        selectedEra
      );

      eraButtons.forEach((item) => {
        item.classList.remove("active");
      });

      button.classList.add("active");

      pediaSets.forEach((set) => {
        const isSelected =
          selectedEra === "all" ||
          set.dataset.eraSet === selectedEra;

        if (isSelected) {
          set.classList.remove("hidden");
        } else {
          set.classList.add("hidden");
        }
      });
    });
  });


  /* =============================
     PRINT FILTER
  ============================== */

  window.addEventListener("beforeprint", () => {
    const selectedEra =
      document.body.getAttribute("data-era") || "all";

    printPages.forEach((page) => {
      const shouldPrint =
        selectedEra === "all" ||
        page.dataset.era === selectedEra;

      if (shouldPrint) {
        page.classList.remove("print-hidden");
      } else {
        page.classList.add("print-hidden");
      }
    });
  });


  window.addEventListener("afterprint", () => {
    printPages.forEach((page) => {
      page.classList.remove("print-hidden");
    });
  });
</script>
