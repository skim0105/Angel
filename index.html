<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Images of the Beyond</title>
  <link rel="stylesheet" href="landing.css">
</head>

<body>
  <main class="landing-page">

    <div class="landing-sentence">
      <span class="angel-trigger">
        Angel
        <img
          class="angel-hover-image"
          src="angel-hover.png"
          alt="Angel image"
        >
      </span>

      is a

      <span
        class="definition-word"
        data-definition="Relating to the sky, heaven, or a spiritual realm."
      >
        celestial
      </span>

      <span
        class="definition-word"
        data-definition="A figure that delivers, transfers, or mediates meaning."
      >
        messenger
      </span>

      and

      <span
        class="definition-word"
        data-definition="Related to the visual symbols and repeated forms used to represent an idea."
      >
        iconographic
      </span>

      figure whose formal representation and cultural significance shift
      according to time, region, and artistic medium
    </div>

    <div class="orbit-container">
      <div class="dashed-ellipse"></div>

      <div class="angel-orbit">
        <img 
          class="orbit-wing"
          id="orbitWing"
          src="wing.png"
          alt="Orbiting wing"
          >
      </div>
    </div>

    <nav class="landing-menu">
      <a
        class="landing-link pedia-link"
        href="angelpedia/angelpedia.html"
      >
        ANGELPEDIA
      </a>

      <a
        class="landing-link verse-link"
        href="angelverse/angelverse.html"
      >
        ANGELVERSE
      </a>
    </nav>

  </main>


<script>
  document.addEventListener("DOMContentLoaded", () => {
    const orbitArea = document.querySelector(".angel-orbit");
    const orbitWing = document.getElementById("orbitWing");

    if (!orbitArea || !orbitWing) return;

    /* 한 바퀴 도는 시간 (숫자가 클수록 느려짐) */
    const orbitDuration = 30;

    /* 시작 위치 (-Math.PI / 2 = 타원 맨 위) */
    const startAngle = -Math.PI / 2;

    let animationStartTime = null;

    function moveWingAlongOrbit(currentTime) {
      if (animationStartTime === null) {
        animationStartTime = currentTime;
      }

      const elapsedSeconds = (currentTime - animationStartTime) / 1000;
      const progress = (elapsedSeconds % orbitDuration) / orbitDuration;
      const angle = startAngle + progress * Math.PI * 2;

      const orbitWidth = orbitArea.clientWidth;
      const orbitHeight = orbitArea.clientHeight;

      const centerX = orbitWidth / 2;
      const centerY = orbitHeight / 2;

      const radiusX = orbitWidth / 2;
      const radiusY = orbitHeight / 2;

      const wingX = centerX + radiusX * Math.cos(angle);
      const wingY = centerY + radiusY * Math.sin(angle);

      /* 위치를 이동시킵니다 */
      orbitWing.style.left = `${wingX}px`;
      orbitWing.style.top = `${wingY}px`;

      /* 💡 [수정] translate(-50%, -50%)로 중심을 잡은 뒤, 
         부모의 rotateX(75deg)에 의해 찌그러진 각도를 rotateX(-75deg)로 역계산하여 
         관객을 향해 똑바로 세워줍니다. 이로 인해 찌그러짐이 완벽히 해결됩니다. */
      orbitWing.style.transform = "translate(-50%, -50%) rotateX(-75deg)";

      window.requestAnimationFrame(moveWingAlongOrbit);
    }

    window.requestAnimationFrame(moveWingAlongOrbit);
  });
</script>



</body>
</html>
